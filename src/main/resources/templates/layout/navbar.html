<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Navbar dùng cho khu vực Shop (Khách hàng) -->
<nav th:fragment="shopNavbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-bag-heart-fill text-danger me-2"></i>DA_HDT Fashion
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/}"><i class="bi bi-house-door me-1"></i>Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-grid me-1"></i>Sản phẩm</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link" th:href="@{/cart}"><i class="bi bi-cart3 me-1"></i>Giỏ hàng</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <!-- Khi chưa đăng nhập -->
                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                    </a>
                </div>

                <!-- Khi đã đăng nhập -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-secondary btn-sm dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li>
                            <h6 class="dropdown-header">
                                Vai trò: <span class="badge bg-primary" sec:authentication="principal.authorities">ROLE</span>
                            </h6>
                        </li>
                        <li sec:authorize="hasAnyRole('ADMIN', 'STORE_MANAGER')">
                            <a class="dropdown-item" th:href="@{/admin}"><i class="bi bi-speedometer2 me-2"></i>Khu Quản Trị</a>
                        </li>
                        <li sec:authorize="hasAnyRole('CASHIER', 'STORE_MANAGER', 'ADMIN')">
                            <a class="dropdown-item" th:href="@{/pos}"><i class="bi bi-calculator me-2"></i>Bán hàng POS</a>
                        </li>
                        <li sec:authorize="hasRole('CUSTOMER')">
                            <a class="dropdown-item" th:href="@{/account}"><i class="bi bi-person me-2"></i>Tài khoản của tôi</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-2">
                                <button type="submit" class="btn btn-danger btn-sm w-100">
                                    <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Navbar dùng cho khu vực Admin (AdminLTE) -->
<nav th:fragment="adminNavbar" class="app-header navbar navbar-expand bg-body shadow-sm">
    <div class="container-fluid">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"><i class="bi bi-list"></i></a>
            </li>
            <li class="nav-item d-none d-md-block">
                <a th:href="@{/admin}" class="nav-link fw-semibold">Bảng điều khiển</a>
            </li>
            <li class="nav-item d-none d-md-block">
                <a th:href="@{/}" class="nav-link text-muted" target="_blank"><i class="bi bi-shop me-1"></i>Xem Shop Online</a>
            </li>
            <li class="nav-item d-none d-md-block" sec:authorize="hasAnyRole('ADMIN', 'STORE_MANAGER', 'CASHIER')">
                <a th:href="@{/pos}" class="nav-link text-muted" target="_blank"><i class="bi bi-upc-scan me-1"></i>Mở quầy POS</a>
            </li>
        </ul>

        <ul class="navbar-nav ms-auto align-items-center gap-3">
            <li class="nav-item dropdown">
                <button class="btn btn-outline-secondary btn-sm dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                    <i class="bi bi-person-badge"></i>
                    <span sec:authentication="name">Admin</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow">
                    <li><h6 class="dropdown-header">Tài khoản Quản trị</h6></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="px-2">
                            <button type="submit" class="btn btn-danger btn-sm w-100">
                                <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                            </button>
                        </form>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

</body>
</html>
