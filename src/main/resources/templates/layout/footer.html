<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Footer dành cho Shop -->
<footer th:fragment="shopFooter" class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
        <p class="mb-1 fw-bold">HỆ THỐNG BÁN LẺ CHUỖI CỬA HÀNG GIÀY DÉP — <span th:text="${brandName}">Triết Store</span></p>
        <p class="small text-muted mb-0">Spring Boot MVC + Thymeleaf + SQL Server · Phiên bản 2.0</p>
    </div>
    <!-- Bootstrap 5 Bundle JS qua CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</footer>

<!-- Footer dành cho AdminLTE -->
<footer th:fragment="adminFooter" class="app-footer">
    <div class="float-end d-none d-sm-inline"><span th:text="${brandName}">Triết Store</span> Retail Chain v2.0</div>
    <strong>Bản quyền &copy; 2026 <a th:href="@{/admin}" class="text-decoration-none"><span th:text="${brandName}">Triết Store</span></a>.</strong> Hệ thống quản trị chuỗi bán lẻ.

    <!-- Bootstrap 5 Bundle JS qua CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- AdminLTE 4 JS qua CDN -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/js/adminlte.min.js"></script>
</footer>

</body>
</html>
