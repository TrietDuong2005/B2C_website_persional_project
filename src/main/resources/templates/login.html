<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Đăng nhập hệ thống - ' + ${brandName})}">
    <title th:text="'Đăng nhập hệ thống - ' + ${brandName}">Đăng nhập hệ thống</title>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container" style="max-width: 480px;">
    <!-- Logo & Tiêu đề -->
    <div class="text-center mb-4">
        <div class="display-6 fw-bold text-dark mb-1">
            <i class="bi bi-shop text-primary me-2"></i><span th:text="${brandName}">Triết Store</span>
        </div>
        <div class="text-muted fw-semibold">Hệ thống Bán lẻ Chuỗi Cửa hàng Giày Dép</div>
    </div>

    <!-- Khung đăng nhập -->
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
            <h4 class="card-title text-center fw-bold mb-3">Đăng nhập</h4>

            <!-- Flash messages -->
            <div th:replace="~{layout/flash :: flashMessages}"></div>

            <form th:action="@{/login}" method="post">
                <!-- CSRF Token tự động được Thymeleaf chèn khi dùng th:action -->
                <!-- Giữ lại tham số redirect khi đăng nhập -->
                <input type="hidden" name="redirect" th:value="${param.redirect}" th:if="${param.redirect != null and !#strings.isEmpty(param.redirect)}">

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Email / Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="admin@dahdt.com" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                </button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/}" class="text-decoration-none small text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Quay lại trang chủ Shop
                </a>
            </div>
        </div>
    </div>

    <!-- Bảng thông tin tài khoản dev thử nghiệm -->
    <div class="card mt-4 border-info shadow-sm bg-info-subtle">
        <div class="card-body p-3">
            <h6 class="fw-bold text-info-emphasis mb-2">
                <i class="bi bi-info-circle-fill me-1"></i>Tài khoản DEV thử nghiệm (mật khẩu: <code>password123</code>):
            </h6>
            <div class="list-group list-group-flush small">
                <button type="button" class="list-group-item list-group-item-action bg-transparent py-1 px-0 border-0"
                        onclick="fillCreds('admin@dahdt.com')">
                    <strong>ADMIN:</strong> <code>admin@dahdt.com</code> <span class="badge bg-danger ms-1">→ /admin</span>
                </button>
                <button type="button" class="list-group-item list-group-item-action bg-transparent py-1 px-0 border-0"
                        onclick="fillCreds('manager@dahdt.com')">
                    <strong>STORE_MANAGER:</strong> <code>manager@dahdt.com</code> <span class="badge bg-warning text-dark ms-1">→ /admin</span>
                </button>
                <button type="button" class="list-group-item list-group-item-action bg-transparent py-1 px-0 border-0"
                        onclick="fillCreds('cashier@dahdt.com')">
                    <strong>CASHIER:</strong> <code>cashier@dahdt.com</code> <span class="badge bg-success ms-1">→ /pos</span>
                </button>
                <button type="button" class="list-group-item list-group-item-action bg-transparent py-1 px-0 border-0"
                        onclick="fillCreds('customer@dahdt.com')">
                    <strong>CUSTOMER:</strong> <code>customer@dahdt.com</code> <span class="badge bg-primary ms-1">→ /</span>
                </button>
            </div>
            <div class="form-text mt-1 text-muted">Nhấn vào tài khoản trên để tự điền nhanh.</div>
        </div>
    </div>
</div>

<script>
    function fillCreds(email) {
        document.getElementById('username').value = email;
        document.getElementById('password').value = 'password123';
    }
</script>

<!-- Bootstrap 5 Bundle JS qua CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
