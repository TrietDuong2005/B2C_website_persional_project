<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('403 - Không có quyền truy cập - ' + ${brandName})}">
    <title th:text="'403 - Không có quyền truy cập - ' + ${brandName}">403 - Không có quyền truy cập</title>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container text-center" style="max-width: 550px;">
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <div class="card-body">
            <div class="display-1 text-danger fw-bold mb-2">
                <i class="bi bi-shield-x"></i> 403
            </div>
            <h3 class="fw-bold text-dark mb-2">Truy cập bị từ chối</h3>
            <p class="text-muted mb-4">
                Tài khoản của bạn không có đủ thẩm quyền để truy cập vào tài nguyên này.
                Nếu bạn cần quyền quản trị hoặc bán hàng, vui lòng liên hệ Người quản trị hệ thống.
            </p>

            <div sec:authorize="isAuthenticated()" class="alert alert-secondary py-2 small mb-4">
                Đang đăng nhập với: <strong sec:authentication="name">User</strong>
                (Vai trò: <span class="badge bg-dark" sec:authentication="principal.authorities">ROLE</span>)
            </div>

            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/}" class="btn btn-primary px-4">
                    <i class="bi bi-house-door me-1"></i>Về Trang chủ
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline" sec:authorize="isAuthenticated()">
                    <button type="submit" class="btn btn-outline-danger">
                        <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất đổi tài khoản
                    </button>
                </form>
                <a th:href="@{/login}" class="btn btn-outline-secondary" sec:authorize="isAnonymous()">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS qua CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
