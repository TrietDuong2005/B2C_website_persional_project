# ====================================================================
# CẤU HÌNH CHUNG (không chứa thông tin nhạy cảm)
# Các cấu hình riêng theo môi trường đặt ở application-{profile}.yml
# Chạy môi trường dev: thêm tham số --spring.profiles.active=dev
# ====================================================================

spring:
  application:
    name: ecommerce

  # Chọn profile mặc định khi chạy (dev = môi trường phát triển cá nhân)
  profiles:
    active: dev

  # Cấu hình JPA chung (các giá trị cụ thể ở application-dev.yml)
  jpa:
    open-in-view: false    # Tắt Open Session in View — best practice để tránh lazy loading ngoài transaction
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect   # Dialect cho SQL Server

  # Flyway: quản lý migration (tạo/sửa bảng CSDL)
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Cấu hình tải tệp lên (multipart) khớp với cấu hình app.upload.max-size-mb
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

# Cấu hình Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html    # Truy cập Swagger UI tại đường dẫn này
  api-docs:
    path: /v3/api-docs        # Đường dẫn lấy tài liệu API dạng JSON

# Cấu hình server
server:
  port: 8080

# Cấu hình thương hiệu, vận chuyển, dữ liệu demo và bảo mật
app:
  brand:
    name: "Triết Store"
  dev-hints: false
  demo-data:
    enabled: false    # Bật true để nạp dữ liệu demo cho báo cáo/dashboard (chỉ chạy một lần trên môi trường dev)
  shipping:
    flat-fee: 30000
    free-threshold: 1000000
  inventory:
    low-stock-threshold: 5             # Ngưỡng cảnh báo tồn kho thấp (mặc định 5 đôi)
  dashboard:
    low-stock-max-rows: 20             # Số dòng tối đa cho bảng cảnh báo tồn thấp
    top-products-limit: 10             # Giới hạn top sản phẩm bán chạy
    pending-orders-limit: 5            # Số đơn online chờ xác nhận mới nhất
    default-days-range: 30             # Khoảng ngày mặc định cho dashboard
  upload:
    dir: "uploads"                      # Thư mục gốc lưu trữ tệp tải lên
    max-size-mb: 2                     # Kích thước tệp tải lên tối đa (MB)
  jwt:
    access-token-expiration: 900000     # 15 phút (milliseconds)
    refresh-token-expiration: 604800000 # 7 ngày (milliseconds)
